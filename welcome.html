<title>e-Winter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --canvas:#E7ECF5;
    --bg:#EEF3FB; --surface:#FFFFFF; --surface-2:#E7EFFB;
    --ink:#0F1E3A; --ink-muted:#5B6B85; --border:#DAE4F3;
    --brand:#2F6FEE; --brand-soft:#E2ECFE; --brand-dark:#1E4FC4;
    --safe:#17A25B; --safe-soft:#DFF6EA;
    --mid:#DB8A0C; --mid-soft:#FBEDD1;
    --bad:#DC3D3D; --bad-soft:#FBE1E1;
    --occupied:#7A5CC9; --occupied-soft:#EAE4F9;
    --marusya-1:#6EA2FF; --marusya-2:#2F6FEE;
    --shadow: 0 1px 2px rgba(16,30,58,0.05), 0 12px 28px -14px rgba(16,30,58,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#0A0F1A;
      --bg:#0F1622; --surface:#161F30; --surface-2:#1D293D;
      --ink:#E7ECF7; --ink-muted:#93A2BE; --border:#293A56;
      --brand:#6C9BFF; --brand-soft:#1C2A47; --brand-dark:#9AB8FF;
      --safe:#3FCB80; --safe-soft:#173626;
      --mid:#F0B64C; --mid-soft:#3A2E14;
      --bad:#F0776D; --bad-soft:#3A1F1E;
      --occupied:#B29EE8; --occupied-soft:#28213C;
      --marusya-1:#6C9BFF; --marusya-2:#3D6EE0;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#0A0F1A;
    --bg:#0F1622; --surface:#161F30; --surface-2:#1D293D; --ink:#E7ECF7; --ink-muted:#93A2BE;
    --border:#293A56; --brand:#6C9BFF; --brand-soft:#1C2A47; --brand-dark:#9AB8FF;
    --safe:#3FCB80; --safe-soft:#173626; --mid:#F0B64C; --mid-soft:#3A2E14;
    --bad:#F0776D; --bad-soft:#3A1F1E; --occupied:#B29EE8; --occupied-soft:#28213C;
    --marusya-1:#6C9BFF; --marusya-2:#3D6EE0;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px -14px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--canvas); color:var(--ink); margin:0;
    font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.55;
  }
  [hidden]{display:none !important;}
  .wrap{max-width:980px;margin:0 auto;padding:28px 24px 40px;}

  /* ---------- App shell: phone-frame layout ---------- */
  .app-shell{
    max-width:460px; margin:0 auto; min-height:100vh; min-height:100dvh;
    background:var(--bg); display:flex; flex-direction:column;
    position:relative; isolation:isolate;
  }
  @media (min-width:520px){
    body{ display:flex; justify-content:center; padding:28px 0; }
    .app-shell{ min-height:844px; height:844px; border-radius:34px; box-shadow:0 24px 64px -24px rgba(16,30,58,0.35); overflow:hidden; border:1px solid var(--border); }
  }
  .app-topbar{
    flex-shrink:0; position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; gap:10px;
  }
  .brandmark{display:flex; align-items:center; gap:9px;}
  .brandmark-icon{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg,var(--marusya-1),var(--marusya-2));
    display:flex; align-items:center; justify-content:center;
  }
  .brandmark-icon svg{width:16px;height:16px;}
  .brandmark-name{font-family:'Spectral',Georgia,serif; font-weight:700; font-size:17px; color:var(--ink); letter-spacing:-0.01em;}
  .lang-toggle{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px; flex-shrink:0;}
  .lang-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.03em;
    border:none; background:transparent; color:var(--ink-muted); padding:6px 11px; border-radius:999px; cursor:pointer;
  }
  .lang-btn.active{background:var(--brand); color:#fff;}

  .app-content{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;}

  .bottom-nav{
    flex-shrink:0; display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)); position:sticky; bottom:0; z-index:20;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:'IBM Plex Sans',sans-serif; font-size:10.5px; color:var(--ink-muted);
    background:none; border:none; cursor:pointer; padding:6px 2px; border-radius:10px;
  }
  .nav-item svg{width:21px;height:21px;}
  .nav-item.active{color:var(--brand);}
  .nav-item:disabled{opacity:0.4; cursor:default;}

  /* ---------- Reusable: risk badge & info tiles ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px; font-family:'IBM Plex Sans',sans-serif;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-safe{background:var(--safe-soft);color:var(--safe);}
  .badge-mid{background:var(--mid-soft);color:var(--mid);}
  .badge-bad{background:var(--bad-soft);color:var(--bad);}
  .badge-occ{background:var(--occupied-soft);color:var(--occupied);}

  .tile-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:16px 0;}
  .tile{background:var(--surface-2); border-radius:13px; padding:12px 6px 10px; text-align:center;}
  .tile svg{width:19px;height:19px;color:var(--brand);}
  .tile-label{display:block; font-size:9.5px; color:var(--ink-muted); margin-top:6px; line-height:1.25;}

  /* ---------- Screen 1: Marusya intro ---------- */
  #screen-intro .wrap{
    min-height:min(88vh,760px); display:flex; flex-direction:column; justify-content:center;
    max-width:640px;
  }
  .avatar{
    width:76px; height:76px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,var(--marusya-1),var(--marusya-2));
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{width:38px;height:38px;}
  .intro-head{display:flex; align-items:center; gap:16px; margin-bottom:26px;}
  .intro-name{font-family:'Spectral',Georgia,serif; font-weight:600; font-size:24px; margin:0;}
  .intro-role{
    font-size:12px; color:var(--ink-muted); display:flex; align-items:center; gap:6px; margin-top:3px;
  }
  .ai-chip{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
    letter-spacing:0.06em; background:var(--surface-2); color:var(--ink-muted);
    border:1px solid var(--border); border-radius:999px; padding:2px 8px;
  }
  .bubble{
    background:var(--surface); border:1px solid var(--border); border-radius:4px 18px 18px 18px;
    box-shadow:var(--shadow); padding:22px 26px; position:relative;
  }
  .bubble p{
    font-family:'Spectral',Georgia,serif; font-size:19px; line-height:1.52;
    margin:0 0 14px; color:var(--ink); text-wrap:balance;
    opacity:0; animation:riseIn 0.6s ease forwards;
  }
  .bubble p:nth-of-type(1){animation-delay:0.15s;}
  .bubble p:nth-of-type(2){animation-delay:0.65s;}
  .bubble p:last-child{margin-bottom:0;}
  @keyframes riseIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .bubble p{animation:none; opacity:1;}
  }

  .btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:15px;
    border:none; border-radius:10px; padding:13px 22px; cursor:pointer;
    background:var(--brand); color:#fff; display:inline-flex; align-items:center; gap:8px;
    transition:transform 0.12s ease, filter 0.12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .btn:focus-visible{outline:2px solid var(--brand); outline-offset:3px;}
  .btn-ghost{
    background:transparent; color:var(--ink-muted); border:1px solid var(--border);
  }
  .cta-row{margin-top:26px; display:flex; align-items:center; gap:14px;}
  .cta-hint{font-size:12.5px; color:var(--ink-muted);}

  /* ---------- Screen 2: situation ---------- */
  .narrator-bar{
    position:sticky; top:0; z-index:5;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:14px 24px; display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(6px);
  }
  .narrator-bar .avatar{width:38px; height:38px;}
  .narrator-bar .avatar svg{width:19px;height:19px;}
  .narrator-line{font-size:14px; max-width:720px;}
  .narrator-line b{font-weight:600;}

  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--brand); font-weight:600; display:flex; align-items:center; gap:9px; margin-top:30px;
  }
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);}

  .exclusion-note{
    margin:20px 0 36px; display:flex; gap:10px; align-items:flex-start;
    background:var(--occupied-soft); border:1px solid var(--occupied); border-radius:10px;
    padding:12px 15px; font-size:13px; color:var(--ink);
  }
  .exclusion-note .dot{width:9px;height:9px;border-radius:2px;background:var(--occupied); margin-top:5px; flex-shrink:0;}
  .exclusion-note b{color:var(--occupied);}

  h2.section{font-family:'Spectral',Georgia,serif; font-weight:600; font-size:20px; margin:0 0 4px;}
  .section-sub{color:var(--ink-muted); font-size:13.5px; margin-bottom:18px; max-width:70ch;}

  .clusters{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:44px;}
  .ccard{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); padding:18px 20px 20px; display:flex; flex-direction:column;
  }
  .ccard-top{display:flex; align-items:center; gap:9px; margin-bottom:3px;}
  .ccard-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .ccard-name{font-weight:600; font-size:15.5px;}
  .ccard-meta{font-size:12px; color:var(--ink-muted); margin-bottom:14px;}
  .ccard-meta b{font-variant-numeric:tabular-nums; color:var(--ink);}

  .vtable{width:100%; font-size:12.5px; margin-bottom:16px; border-collapse:collapse;}
  .vtable td{padding:4px 0; font-variant-numeric:tabular-nums;}
  .vtable td.lbl{color:var(--ink-muted);}
  .vtable td.val{text-align:right; font-weight:600;}
  .vtable td.rk{text-align:right; color:var(--ink-muted); font-size:11px; width:58px;}

  .region-list{border-top:1px solid var(--border); padding-top:12px; margin-top:auto; display:flex; flex-direction:column; gap:5px; font-size:13px;}

  .cities{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:8px;}
  .citycard{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 14px 15px; box-shadow:var(--shadow);}
  .citycard .cname{font-family:'Spectral',Georgia,serif; font-weight:600; font-size:15px; margin-bottom:2px;}
  .citycard .coblast{font-size:11.5px; color:var(--ink-muted); margin-bottom:10px;}
  .citycard .cscore{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; margin-bottom:2px;}
  .citycard .clabel{font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-muted); margin-bottom:10px;}
  .citycard .ctag{display:inline-block; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px; font-family:'IBM Plex Mono',monospace;}
  .citycard .cbreak{display:flex; gap:6px; margin-top:11px; font-size:10px; color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; flex-wrap:wrap;}
  .citycard .cbreak span{background:var(--surface-2); border-radius:5px; padding:2px 5px;}

  .tag-safe{background:var(--safe-soft); color:var(--safe);}
  .tag-mid{background:var(--mid-soft); color:var(--mid);}
  .tag-bad{background:var(--bad-soft); color:var(--bad);}
  .tag-occ{background:var(--occupied-soft); color:var(--occupied);}

  .next{
    margin-top:40px; padding:24px 26px; border-radius:14px;
    background:linear-gradient(135deg, var(--brand-soft), var(--surface-2));
    border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .next p{font-size:15px; margin:0; max-width:52ch;}
  .next p b{color:var(--brand);}

  .methnote{
    border-top:1px solid var(--border); margin-top:38px; padding-top:20px;
    font-size:12px; color:var(--ink-muted); display:flex; justify-content:space-between;
    flex-wrap:wrap; gap:10px; font-family:'IBM Plex Mono',monospace;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); font-size:13.5px; padding:12px 20px; border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease;
    max-width:80vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:800px){
    .clusters{grid-template-columns:1fr;}
    .cities{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:460px){ .cities{grid-template-columns:1fr;} }

  /* ---------- Screen 3: search ---------- */
  .search-wrap{position:relative;}
  .search-input{width:100%;font-size:17px;font-family:'IBM Plex Sans',sans-serif;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);}
  .search-input:focus{outline:2px solid var(--brand);outline-offset:2px;}
  .search-results{margin-top:10px;display:flex;flex-direction:column;gap:2px;}
  .result-row{padding:11px 14px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;}
  .result-row:hover{background:var(--surface-2);}
  .result-name{font-weight:600;font-size:14.5px;}
  .result-meta{font-size:12px;color:var(--ink-muted);white-space:nowrap;}
  .result-empty{font-size:13.5px;color:var(--ink-muted);padding:10px 4px;}

  /* ---------- Screen 4: dashboard ---------- */
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;font-family:'IBM Plex Mono',monospace;}
  .tag-safe{background:var(--safe-soft);color:var(--safe);}
  .tag-mid{background:var(--mid-soft);color:var(--mid);}
  .tag-bad{background:var(--bad-soft);color:var(--bad);}

  .dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:6px;}
  .dash-score{text-align:right;}
  .dash-score-num{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:8px;}
  .dash-score-num.tier-safe{color:var(--safe);}
  .dash-score-num.tier-mid{color:var(--mid);}
  .dash-score-num.tier-bad{color:var(--bad);}

  .meters{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 22px;margin:24px 0;}
  .meter-row{display:grid;grid-template-columns:160px 1fr 130px;align-items:center;gap:14px;padding:9px 0;}
  .meter-label{font-size:13px;color:var(--ink-muted);}
  .meter-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
  .meter-fill{height:100%;border-radius:5px;background:var(--brand);}
  .meter-val{font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted);}

  .fac-note{font-size:13px;color:var(--ink-muted);background:var(--surface-2);border-radius:10px;padding:12px 16px;margin:18px 0;}

  .advice-box{border-radius:14px;padding:18px 22px;font-size:14.5px;margin:20px 0;border:1px solid;}
  .advice-box.tier-safe-box{background:var(--safe-soft);border-color:var(--safe);}
  .advice-box.tier-mid-box{background:var(--mid-soft);border-color:var(--mid);}
  .advice-box.tier-bad-box{background:var(--bad-soft);border-color:var(--bad);}
  .advice-box p{margin:0;}

  .reco-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:10px;}
  .reco-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
  .reco-name{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:15px;margin-bottom:4px;}
  .reco-meta{font-size:12px;color:var(--ink-muted);margin-bottom:8px;}
  .reco-score{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--safe);font-weight:600;}
  .reco-card.clickable{cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .reco-card.clickable:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .reco-hint{font-size:11px;color:var(--brand);font-weight:600;margin-top:8px;}

  .oblast-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .oblast-chip{font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
  .oblast-chip:hover{background:var(--surface-2);}
  .oblast-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* ---------- Screen 3b: settlement picker ---------- */
  .settlement-search{width:100%;font-size:14px;font-family:'IBM Plex Sans',sans-serif;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);margin-bottom:14px;}
  .settlement-search:focus{outline:2px solid var(--brand);outline-offset:2px;}
  .settlement-row{padding:10px 14px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid transparent;}
  .settlement-row:hover{background:var(--surface-2);border-color:var(--border);}
  .settlement-name{font-weight:500;font-size:14px;}
  .settlement-type-tag{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-muted);background:var(--surface-2);border-radius:999px;padding:2px 8px;white-space:nowrap;}

  /* ---------- Screen 5: livability review ---------- */
  .review-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px;}
  .review-card-title{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:16px;margin-bottom:8px;}
  .review-card p{margin:6px 0;font-size:13.5px;line-height:1.55;}
  .review-card.review-pending{border-style:dashed;background:var(--surface-2);}
  .kids-toggle{display:flex;gap:8px;margin-top:10px;}
  .btn-toggle{font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn-toggle.active{background:var(--brand);border-color:var(--brand);color:#fff;}
  .kids-note{font-size:13px;border-radius:10px;padding:10px 14px;margin-top:8px;}
  .kids-note.ok{background:var(--safe-soft);color:var(--safe);}
  .kids-note.warn{background:var(--mid-soft);color:var(--mid);}

  .next-caveat{font-size:12.5px;color:var(--ink-muted);border-top:1px solid var(--border);padding-top:16px;margin-top:30px;}

  @media (max-width:700px){
    .meter-row{grid-template-columns:120px 1fr 80px;gap:8px;}
    .reco-list{grid-template-columns:1fr;}
    .dash-head{flex-direction:column;align-items:flex-start;}
    .dash-score{text-align:left;}
  }
</style>

<div class="app-shell">
  <div class="app-topbar">
    <div class="brandmark">
      <div class="brandmark-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M5 7l14 10M19 7L5 17"/></svg>
      </div>
      <span class="brandmark-name">e-Winter</span>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="lang-uk" class="lang-btn" onclick="setLang('uk')">UA</button>
      <button type="button" id="lang-en" class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="app-content">

    <section id="screen-intro">
      <div class="wrap" id="intro-content"></div>
    </section>

    <section id="screen-clusters" hidden>

  var TRANSLIT_MAP = {
    'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh','з':'z',
    'и':'y','і':'i','ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p',
    'р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch',
    'ь':'','ю':'iu','я':'ia',"'":'','’':'','ʼ':''
  };
  function translit(s){
    if(!s) return s;
    var out = '';
    for(var i=0;i<s.length;i++){
      var ch = s[i], lower = ch.toLowerCase();
      var mapped = TRANSLIT_MAP.hasOwnProperty(lower) ? TRANSLIT_MAP[lower] : ch;
      if(ch !== lower && mapped) mapped = mapped.charAt(0).toUpperCase() + mapped.slice(1);
      out += mapped;
    }
    return out;
  }

  function haversineKm(lat1,lon1,lat2,lon2){
    var R = 6371.0088;
    var p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
    var dphi = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
    var a = Math.sin(dphi/2)*Math.sin(dphi/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.asin(Math.sqrt(a));
  }

    if(ov < 0.30) return {key:'mid', label:t('tier_mid')};

  }

           '<div class="meter-val">'+display+'</div></div>';
  }

    var chips = document.querySelectorAll('#oblast-chips .oblast-chip');

      if(x[IDX.pop] < 50000) continue;

      cands.push({idx:j, name:x[IDX.n], oblast:x[IDX.o], pop:x[IDX.pop], ov:x[IDX.ov], dist:haversineKm(lat1,lon1,x[IDX.lat],x[IDX.lon])});

  function findSafeAlternatives(current){
    var data = loadData();
    var lat1 = current[IDX.lat], lon1 = current[IDX.lon];
    var cands = [];
    for(var i=0;i<data.rows.length;i++){
      var r = data.rows[i];
      if(r === current) continue;
      if(r[IDX.ov] >= 0.10) continue;
      if(r[IDX.pop] < 50000) continue;
      if(r[IDX.urb] < 0.6) continue;
      var d = haversineKm(lat1, lon1, r[IDX.lat], r[IDX.lon]);
      cands.push({idx:i, name:r[IDX.n], oblast:r[IDX.o], pop:r[IDX.pop], ov:r[IDX.ov], dist:d});
    }
    cands.sort(function(a,b){ return a.dist - b.dist; });
    return cands.slice(0,3);
  }

    html += '<div class="tile-row">';
    html += tileHtml('shield', t('m_attack'), pctStr(x1));
    html += tileHtml('bolt', t('m_outage'), x2.toFixed(3));
    html += tileHtml('map', t('m_front'), x3.toFixed(3));
    html += tileHtml('database', t('m_logistics'), x4===null ? '—' : x4.toFixed(3));
    html += '</div>';

    html += '<div class="meters">';
    html += meterRow(t('m_attack'), pctStr(x1), x1);
    html += meterRow(t('m_outage'), x2.toFixed(3), x2);
    html += meterRow(t('m_front'), x3.toFixed(3)+' &middot; '+fl+' '+t('km_to_front'), x3);
    html += meterRow(t('m_logistics'), x4===null ? t('no_data') : x4.toFixed(3), x4===null ? 0 : x4);
    html += '</div>';

    if(fac){
      html += '<div class="fac-note"><b>'+t('facilities_prefix')+'</b> '+fac+'</div>';
    }

    html += '<div class="advice-box tier-'+tier.key+'-box">';
    html += '<p><b>'+t('advice_label')+'</b> '+t('advice_'+tier.key)+'</p>';
    html += '</div>';

    if(tier.key !== 'safe'){
      html += '<h2 class="section" style="margin-top:34px;">'+t('nearest_safer')+'</h2>';
      html += '<p class="section-sub">'+t('nearest_safer_sub')+'</p>';
      var recos = findSafeAlternatives(r);
      if(recos.length){
        html += '<div class="reco-list">';
        recos.forEach(function(rec){ html += recoCardHtml(rec); });
        html += '</div>';
      }

      var otherOblasts = SAFE_OBLASTS.filter(function(ob){ return ob !== rawOblast; });
      html += '<h2 class="section" style="margin-top:34px;">'+t('choose_oblast')+'</h2>';
      html += '<p class="section-sub">'+t('choose_oblast_sub')+'</p>';
      html += '<div class="oblast-chips" id="oblast-chips">';
      otherOblasts.forEach(function(ob){
        html += '<button type="button" class="oblast-chip" onclick="selectOblastCity(\''+ob+'\', this)">'+placeName(ob)+'</button>';
      });
      html += '</div>';
      html += '<div id="oblast-recos" class="reco-list" style="margin-top:14px;"></div>';
    }

    html += '<button class="btn" onclick="showReview()" style="margin-top:28px;">'+t('cta_review')+' &nbsp;&rarr;</button>';
    html += '<div class="next-caveat">'+t('dash_caveat')+'</div>';

    document.getElementById('dash-content').innerHTML = html;
  }

  function tileHtml(icon, label, val){
    return '<div class="tile">'+ICONS[icon]+'<span class="tile-label">'+label+'<br><b style="color:var(--ink);">'+val+'</b></span></div>';
  }
  var ICONS = {
    shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>',
    bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
    map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v15M15 6v15M4 5l5-2 6 2 5-2v15l-5 2-6-2-5 2V5z"/></svg>',
    database:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.5"/><path d="M4.5 5.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/><path d="M4.5 11.5v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/></svg>',
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>',
    coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 9.5c0-1 1-1.8 2.5-1.8s2.5.7 2.5 1.7c0 2.4-5 1.3-5 3.7 0 1 1 1.7 2.5 1.7s2.5-.8 2.5-1.8"/></svg>',
    school:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M6 10.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5"/></svg>'
  };

  function initApp(){
    renderChrome();
    renderIntro();
    renderClustersScreen();
    renderInputScreen();
    renderAbout();
    setActiveNav();
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', initApp); }
  else { initApp(); }
</script>
